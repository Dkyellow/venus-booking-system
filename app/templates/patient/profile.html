{% extends "base.html" %}
{% block title %}My Profile - Venus Clinic{% endblock %}
{% block extra_css %}<link href="{{ url_for('static', filename='css/dashboard.css') }}" rel="stylesheet">{% endblock %}
{% block body %}
<div class="dashboard-layout">
{% include "components/sidebar.html" %}
<main class="main-content">
{% include "components/navbar.html" %}
<div class="page-content">
<div class="row justify-content-center"><div class="col-lg-8">
<h4 class="fw-bold mb-4">My Profile</h4>
<div class="card"><div class="card-body">
<form method="POST"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<div class="row g-3">
<div class="col-md-6"><label class="form-label">First Name</label><input type="text" name="first_name" class="form-control" value="{{ patient.first_name }}" required></div>
<div class="col-md-6"><label class="form-label">Last Name</label><input type="text" name="last_name" class="form-control" value="{{ patient.last_name }}" required></div>
<div class="col-md-6"><label class="form-label">Email</label><input type="email" class="form-control" value="{{ patient.email }}" disabled></div>
<div class="col-md-6"><label class="form-label">Phone</label><input type="tel" name="phone" class="form-control" value="{{ patient.phone or '' }}"></div>
<div class="col-md-6"><label class="form-label">Date of Birth</label><input type="date" name="date_of_birth" class="form-control" value="{{ patient.date_of_birth.strftime('%Y-%m-%d') if patient.date_of_birth else '' }}"></div>
<div class="col-md-6"><label class="form-label">Gender</label><select name="gender" class="form-select"><option value="">Select</option><option {% if patient.gender=='Male' %}selected{% endif %}>Male</option><option {% if patient.gender=='Female' %}selected{% endif %}>Female</option><option {% if patient.gender=='Other' %}selected{% endif %}>Other</option></select></div>
<div class="col-12"><label class="form-label">Address</label><textarea name="address" class="form-control" rows="2">{{ patient.address or '' }}</textarea></div>
<div class="col-md-6"><label class="form-label">Emergency Contact Name</label><input type="text" name="emergency_contact_name" class="form-control" value="{{ patient.emergency_contact_name or '' }}"></div>
<div class="col-md-6"><label class="form-label">Emergency Contact Phone</label><input type="tel" name="emergency_contact_phone" class="form-control" value="{{ patient.emergency_contact_phone or '' }}"></div>
</div>
<div class="d-flex gap-2 mt-4"><button type="submit" class="btn btn-primary"><i class="fas fa-save me-1"></i>Save Changes</button></div>
</form></div></div>
</div></div>
</div></div>
</main></div>{% endblock %}
