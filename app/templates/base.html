<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>{% block title %}Venus Medical & Dental Centre{% endblock %}</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='logo.png') }}">
    <meta name="description" content="Venus Medical & Dental Centre - Comprehensive medical, dental, mental health, diagnostic, preventative, and specialist healthcare services in Mount Pleasant, Harare, Zimbabwe.">
    <meta name="keywords" content="doctor, dental, medical, healthcare, Harare, Zimbabwe, dentist, psychiatrist, dermatology, paediatrics, vaccination">
    <meta name="author" content="Venus Medical & Dental Centre">
    <link rel="canonical" href="https://venushealthcare.co.zw">
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://venushealthcare.co.zw">
    <meta property="og:title" content="Venus Medical & Dental Centre">
    <meta property="og:description" content="Comprehensive medical, dental, mental health, diagnostic, preventative, and specialist healthcare services. Book your appointment online.">
    <meta property="og:image" content="https://venus-booking-system.onrender.com/static/logo.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:site_name" content="Venus Medical & Dental Centre">
    <meta property="og:locale" content="en_ZW">
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:url" content="https://venushealthcare.co.zw">
    <meta name="twitter:title" content="Venus Medical & Dental Centre">
    <meta name="twitter:description" content="Comprehensive medical, dental, mental health, diagnostic, preventative, and specialist healthcare services. Book your appointment online.">
    <meta name="twitter:image" content="https://venus-booking-system.onrender.com/static/logo.png">
    <meta name="twitter:site" content="@venus_surgery">
    <meta name="twitter:creator" content="@venus_surgery">
    <!-- WhatsApp specific -->
    <meta property="og:image:alt" content="Venus Medical & Dental Centre - Healthcare in Harare">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/main.css') }}" rel="stylesheet">
    {% block extra_css %}{% endblock %}
</head>
<body>
    {% block body %}{% endblock %}
    <div id="toast-container" class="toast-container"></div>
    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
    {% for category, message in messages %}
    <div class="flash-message" data-message="{{ message }}" data-type="{{ category }}" style="display:none;"></div>
    {% endfor %}
    {% endif %}
    {% endwith %}
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
